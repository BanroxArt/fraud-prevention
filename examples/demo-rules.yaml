# Demo rules: the packaged defaults plus a documentation IP range as the
# hosting list, so the synthetic data and examples/events.jsonl have something
# to hit. Do not copy the hosting range into real rules; it never matches real
# traffic.
version: 1

decision:
  review_at: 40
  deny_at: 80

velocity:
  - code: VEL_LOGIN_IP_PREFIX
    events: [login]
    key: ip_prefix
    window: 10m
    threshold: 30
    weight: 25
  - code: VEL_FAILED_LOGIN_ACCOUNT
    events: [login]
    key: account_id
    where: {success: false}
    window: 15m
    threshold: 10
    weight: 20
  - code: VEL_SIGNUPS_PER_DEVICE
    events: [signup]
    key: device_id
    distinct: account_id
    window: 24h
    threshold: 3
    weight: 45
  - code: VEL_CARDS_PER_ACCOUNT
    events: [payment]
    key: account_id
    distinct: card_fp
    window: 24h
    threshold: 4
    weight: 40
  - code: VEL_CARD_ATTEMPTS
    events: [payment]
    key: card_fp
    window: 10m
    threshold: 8
    weight: 50
  - code: VEL_CARD_SPEND
    events: [payment]
    key: card_fp
    sum: amount
    window: 1h
    threshold: 2500
    weight: 25
  - code: VEL_WITHDRAWALS_PER_ACCOUNT
    events: [withdrawal]
    key: account_id
    window: 24h
    threshold: 4
    weight: 30

weights:
  LATE_EVENT: 0
  CLOCK_AHEAD: 0
  EMAIL_DISPOSABLE: 30
  EMAIL_PLUS_TAG: 5
  EMAIL_DIGIT_HEAVY: 8
  EMAIL_RANDOM_LOCALPART: 12
  EMAIL_MALFORMED: 20
  EMAIL_MISSING: 0
  IP_HOSTING: 20
  IP_BLOCKLIST: 70
  IP_NON_ROUTABLE: 0
  IP_MALFORMED: 5
  ATO_NEW_DEVICE_LOGIN: 5
  ATO_CRED_CHANGE_AFTER_NEW_DEVICE: 30
  ATO_NEW_DEVICE_CASHOUT: 35
  ATO_CRED_CHANGE_CASHOUT: 25
  ATO_CRED_AND_NEW_DEVICE: 55
  ATO_SEQUENCE: 85
  ID_PHONE_REUSE: 30
  ID_ADDRESS_REUSE: 15
  ID_CARD_REUSE_AT_SIGNUP: 35
  PROMO_LINKED_REDEMPTION: 60
  PROMO_REPEAT_ACCOUNT: 40
  LINK_SUPERNODE: 0

email:
  disposable_domains:
    - mailinator.com
    - guerrillamail.com
    - 10minutemail.com
    - yopmail.com
    - trashmail.com
    - sharklasers.com

ip:
  hosting_cidrs: [203.0.113.0/24]   # RFC 5737 documentation range, demo only
  blocked_cidrs: []

ato:
  window: 24h
  device_ttl: 90d             # forget devices and idle accounts after this

linking:
  link_on: [device_id, card_fp, email_norm, phone]
  window: 90d                 # links and redemptions older than this age out
  max_attribute_degree: 25    # one attribute links at most this many accounts
  max_cluster_size: 500       # refuse merges that would grow a cluster past this
  promo_max_accounts_per_cluster: 1

identity:
  reuse_window: 30d
  reuse_threshold: 3
  card_reuse_threshold: 2

# Memory bounds. Event fields become keys, so these stop a sender that
# rotates device ids or card fingerprints from growing state without limit.
state:
  dedup_window: 24h           # repeated event_id inside this returns the first decision
  dedup_max_ids: 200000
  max_keys_per_window: 1000000
  max_accounts: 1000000
  max_link_edges: 2000000
  allowed_lateness: 1h
  late_action: review

allowlist:
  accounts: []
