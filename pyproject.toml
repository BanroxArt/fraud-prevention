[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudkit"
version = "0.1.0"
description = "Small, explainable fraud scoring engine: velocity windows, identity reuse, account takeover sequences, promo-ring linking."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian", email = "opensource@banrox.com" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100", "types-PyYAML"]


[project.urls]
Homepage = "https://banrox.com"
Source = "https://github.com/BanroxArt/fraud-prevention"

[project.scripts]
fraudkit = "fraudkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraudkit = ["default_rules.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
